name: Export and Release Resumes

on:
  push:
    branches:
      - main
    paths:
      - 'resume.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Themes
        run: npm run build:themes

      - name: Install Chrome for Puppeteer
        run: |
          rm -rf ~/.cache/puppeteer
          npx puppeteer browsers install chrome

      - name: Export Resumes
        run: npm run export
        env:
          RESUME_PUPPETEER_NO_SANDBOX: "1"

      - name: Upload PDF Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: output/*.pdf
          if-no-files-found: error

      - name: Prepare Release Notes
        id: release_info
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          cat << 'EOF' > release_notes.md
          ## Automated Resume Export

          Exported PDFs generated from `resume.json`.

          ### Included Themes
          EOF

          for file in output/*.pdf; do
            filename=$(basename "$file")
            echo "- \`$filename\`" >> release_notes.md
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Resume Release ${{ steps.release_info.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: output/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
